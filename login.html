<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8ff">
<title>Login • AURA</title>
<link rel="icon" href="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg">
<style>
:root{--bg:#f5f8ff;--card:#fff;--bd:#e1e8f5;--v:#2563eb;--v2:#3b82f6;--tx:#0f172a;--mu:#667085;--g:linear-gradient(135deg,#3b82f6,#1d4ed8)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:radial-gradient(circle at 8% 8%,#dbeafe 0,transparent 34%),radial-gradient(circle at 92% 88%,#bfdbfe 0,transparent 32%),var(--bg)}
.wrap{width:min(100%,420px)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 20px}.logo{width:58px;height:58px;flex:0 0 58px;border-radius:16px;object-fit:contain;background:#fff;border:1px solid #dbeafe;padding:3px;box-shadow:0 10px 24px #2563eb38}.brand strong{font-size:21px;letter-spacing:.5px}.brand small{display:block;color:var(--mu);font-size:12px;margin-top:2px;letter-spacing:1.4px}.card{padding:30px 25px 24px;border:1px solid #e1e8f5;border-radius:26px;background:rgba(255,255,255,.94);box-shadow:0 22px 60px #1e3a8a12}.top-icon{width:58px;height:58px;margin:0 auto 16px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(135deg,#dbeafe,#eff6ff);color:var(--v);border:1px solid #bfdbfe}.top-icon svg{width:27px;height:27px}.card h1{text-align:center;font-size:25px;margin:0;font-weight:900;letter-spacing:-.6px}.sub{text-align:center;color:var(--mu);font-size:14px;line-height:1.6;margin:9px 0 24px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:8px}.input-wrap{position:relative}.input-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:#7c8aa5;pointer-events:none}.input-wrap input{width:100%;height:51px;border:1px solid #dbe3f0;border-radius:14px;padding:0 44px 0 44px;background:#f9fbff;color:var(--tx);font:inherit;outline:none;transition:.2s}.input-wrap input:focus{border-color:var(--v2);box-shadow:0 0 0 4px #3b82f61c;background:#fff}.toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#64748b;padding:8px;cursor:pointer}.toggle svg{position:static;transform:none;width:18px;height:18px}.forgot{display:block;text-align:right;margin:2px 0 18px;color:var(--v);font-size:13px;font-weight:800;text-decoration:none}.submit{width:100%;height:51px;border:0;border-radius:14px;background:var(--g);color:#fff;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 10px 22px #2563eb30;transition:transform .15s,filter .15s}.submit:active{transform:scale(.985)}.submit:disabled{opacity:.65;cursor:wait}.msg{display:none;margin-top:14px;padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.5}.msg.show{display:block}.msg.error{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}.msg.ok{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}.foot{text-align:center;color:#8490a5;font-size:12px;margin:17px 0 0}.back{display:block;text-align:center;margin-top:17px;color:#64748b;text-decoration:none;font-size:13px;font-weight:700}.back:hover,.forgot:hover{color:#1d4ed8}@media(max-width:380px){.card{padding:25px 18px}.card h1{font-size:23px}}
</style></head>
<body><main class="wrap">
<div class="brand"><img class="logo" src="https://videotourl.com/images/1789792991627-2a906ffa-fbc0-4f79-9d9b-8dddb80ca667.jpg" alt="AURA ARMAN TOUR Logo"><div><strong>AURA ARMAN TOUR</strong><small>SECURE ACCOUNT</small></div></div>
<section class="card"><div class="top-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
<h1>আবার ফিরে আসুন</h1><p class="sub">আপনার অ্যাকাউন্টে লগইন করে চালিয়ে যান</p>
<form id="loginForm" novalidate><div class="field"><label for="email">ইমেইল অ্যাড্রেস</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><input id="email" type="email" autocomplete="username" placeholder="আপনার ইমেইল লিখুন" required></div></div>
<div class="field"><label for="password">পাসওয়ার্ড</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" autocomplete="current-password" placeholder="আপনার পাসওয়ার্ড লিখুন" required><button class="toggle" type="button" id="togglePass" aria-label="পাসওয়ার্ড দেখান"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<a href="#" class="forgot" id="forgot">পাসওয়ার্ড ভুলে গেছেন?</a><button class="submit" id="submitBtn" type="submit">LOGIN করুন&nbsp; →</button><div class="msg" id="msg" role="status"></div></form></section>
<a class="back" href="FFX.html">← হোম পেজে ফিরে যান</a><p class="foot">Secure sign-in powered by Firebase</p></main>
<script type="module">
import { signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import { auth } from './firebase.js';
const form=document.getElementById('loginForm'), email=document.getElementById('email'), password=document.getElementById('password'), btn=document.getElementById('submitBtn'), msg=document.getElementById('msg');
function show(text,type='error'){msg.textContent=text;msg.className='msg show '+type;}
onAuthStateChanged(auth,user=>{if(user)location.replace('FFX.html');});
document.getElementById('togglePass').addEventListener('click',()=>{password.type=password.type==='password'?'text':'password';});
form.addEventListener('submit',async e=>{e.preventDefault();const em=email.value.trim(),pw=password.value;if(!em||!pw){show('ইমেইল ও পাসওয়ার্ড দুটোই লিখুন।');return;}btn.disabled=true;btn.textContent='লগইন হচ্ছে…';try{await signInWithEmailAndPassword(auth,em,pw);show('লগইন সফল। হোম পেজে নেওয়া হচ্ছে…','ok');location.replace('FFX.html');}catch(err){const m={'auth/invalid-credential':'ইমেইল বা পাসওয়ার্ড সঠিক নয়।','auth/user-not-found':'এই ইমেইলে কোনো অ্যাকাউন্ট পাওয়া যায়নি।','auth/wrong-password':'পাসওয়ার্ড সঠিক নয়।','auth/invalid-email':'সঠিক ইমেইল লিখুন।','auth/too-many-requests':'অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।','auth/network-request-failed':'ইন্টারনেট সংযোগ পরীক্ষা করুন।'};show(m[err.code]||'লগইন করা যায়নি। তথ্য যাচাই করে আবার চেষ্টা করুন।');btn.disabled=false;btn.textContent='LOGIN করুন  →';}});
document.getElementById('forgot').addEventListener('click',async e=>{e.preventDefault();const em=email.value.trim();if(!em){show('পাসওয়ার্ড রিসেট লিংক পেতে আগে ইমেইল লিখুন।');email.focus();return;}try{await sendPasswordResetEmail(auth,em);show('পাসওয়ার্ড রিসেট লিংক আপনার ইমেইলে পাঠানো হয়েছে।','ok');}catch(err){show('রিসেট লিংক পাঠানো যায়নি। ইমেইল ও সংযোগ পরীক্ষা করুন।');}});
</script></body></html>
